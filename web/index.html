<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15151a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="rougarou: an indoor bouldering game at the rougarou rock lounge. walk the gym, pull onto a problem, move each hand and foot, shift your weight, send it.">
<title>rougarou</title>
<link rel="stylesheet" href="./style.css">
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } }</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="loading">setting the problems...</div>

<div class="hud top" id="hud">
	<div class="card" id="card">
		<div class="row"><span class="chip" id="grade"><i></i><span></span></span><span id="route"></span><span id="timer"></span></div>
		<div id="status"></div>
	</div>
	<div class="card gauges" id="gauges">
		<span>pump <span class="bar"><i id="pumpL"></i></span><span class="bar"><i id="pumpR"></i></span></span>
		<span>chalk <span class="bar"><i id="chalkL"></i></span><span class="bar"><i id="chalkR"></i></span></span>
		<span class="weight">weight <span class="bar"><i id="load3"></i></span><span class="bar"><i id="load2"></i></span><span class="bar"><i id="load1"></i></span><span class="bar"><i id="load0"></i></span></span>
	</div>
</div>
<div id="corner">
	<button class="round" id="menuBtn" aria-label="menu"><svg viewBox="0 0 16 16"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg></button>
</div>
<div id="toasts"></div>
<div id="ai" class="card" hidden></div>
<div id="tip" class="card"></div>

<div class="hud bottom" id="bar">
	<button id="prev" aria-label="previous problem">&lsaquo;</button>
	<button id="retry">retry</button>
	<button id="fpBtn" hidden>first person</button>
	<button id="chalkBtn" hidden>chalk up</button>
	<button id="watch" hidden>watch the ai</button>
	<button id="fpRH" hidden>right hand</button><button id="fpLH" hidden>left hand</button><button id="fpRF" hidden>right foot</button><button id="fpLF" hidden>left foot</button>
	<button id="pull" class="hot" hidden>pull on</button>
	<button id="edit" hidden>set this problem</button>
	<button id="back" class="hot" hidden>put back</button>
	<button id="hang" hidden>let it hang</button>
	<button id="drop" hidden>jump down</button>
	<button id="next" aria-label="next problem">&rsaquo;</button>
	<span class="card keys" id="keys"></span>
</div>

<div id="editbar" class="glass" hidden>
	<button id="eKind">jug</button>
	<button class="round" id="eLeft" aria-label="rotate left"><svg viewBox="0 0 16 16"><path d="M4 6.5a5 5 0 1 1 0.6 4.6M4 2.8v3.7h3.7"/></svg></button>
	<button class="round" id="eRight" aria-label="rotate right"><svg viewBox="0 0 16 16"><path d="M12 6.5a5 5 0 1 0-0.6 4.6M12 2.8v3.7H8.3"/></svg></button>
	<span class="sep"></span>
	<button id="eAdd">add hold</button>
	<button id="eDel" class="danger">remove</button>
	<button id="eReset" class="ghost">reset</button>
	<span class="sep"></span>
	<button id="eDone" class="hot">done</button>
</div>

<div id="sent" hidden><div class="card">
	<div class="kicker" id="sentRoute"></div>
	<h2>SENT</h2>
	<div class="line" id="sentLine"></div>
	<div class="badges" id="sentBadges"></div>
	<div class="actions"><button id="again">again</button><button id="onward">jump down</button><button id="nextUp" class="hot">next problem</button></div>
</div></div>

<div id="menu" class="screen">
	<div class="sheet glass">
		<header class="sheet-head">
			<div><div class="kicker">the rock lounge</div><div class="logo">rouga<b>rou</b></div></div>
			<div class="score" id="score"></div>
		</header>
		<nav class="tabs" id="tabs">
			<button data-tab="problems" class="on">problems</button>
			<button data-tab="clips">clips</button>
			<button data-tab="settings">settings</button>
			<button data-tab="how">how to climb</button>
		</nav>
		<div class="sheet-body">
			<section data-pane="problems"><div class="problems" id="problems"></div></section>
			<section data-pane="clips" hidden><div id="clips"></div></section>
			<section data-pane="settings" hidden><div class="settings" id="settings"></div></section>
			<section data-pane="how" hidden><div class="how" id="how"></div></section>
		</div>
		<footer class="sheet-foot"><span class="grow" id="menuNote"></span><button class="primary" id="play">walk into the gym</button></footer>
	</div>
</div>

<div id="stick" hidden><i></i></div>
<div id="cross" hidden></div>
<script type="module" src="./main.js"></script>
</body>
</html>
